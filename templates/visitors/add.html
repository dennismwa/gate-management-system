{% extends "base.html" %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <!-- Header -->
    <div class="mb-8">
        <div class="flex items-center justify-between">
            <div>
                <h1 class="text-3xl font-bold text-gray-900">Add New Visitor</h1>
                <p class="text-gray-600 mt-1">Register a new visitor for access control</p>
            </div>
            
            <a href="/visitors" 
               class="inline-flex items-center px-4 py-2 border border-gray-300 shadow-sm text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                <i data-feather="arrow-left" class="w-4 h-4 mr-2"></i>
                Back to Visitors
            </a>
        </div>
    </div>
    
    <!-- Form -->
    <div class="bg-white shadow-sm rounded-lg">
        <form id="visitor-form" class="space-y-6 p-6">
            <!-- Personal Information Section -->
            <div>
                <h3 class="text-lg font-medium text-gray-900 mb-4">Personal Information</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Full Name -->
                    <div>
                        <label for="full_name" class="block text-sm font-medium text-gray-700 mb-2">
                            Full Name <span class="text-red-500">*</span>
                        </label>
                        <input type="text" id="full_name" name="full_name" required
                               class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                               placeholder="Enter visitor's full name">
                        <div class="mt-1 text-sm text-red-600 hidden" id="full_name_error"></div>
                    </div>
                    
                    <!-- Phone -->
                    <div>
                        <label for="phone" class="block text-sm font-medium text-gray-700 mb-2">
                            Phone Number
                        </label>
                        <input type="tel" id="phone" name="phone"
                               class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                               placeholder="+254 700 000 000">
                        <div class="mt-1 text-sm text-red-600 hidden" id="phone_error"></div>
                    </div>
                    
                    <!-- Email -->
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                            Email Address
                        </label>
                        <input type="email" id="email" name="email"
                               class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                               placeholder="visitor@example.com">
                        <div class="mt-1 text-sm text-red-600 hidden" id="email_error"></div>
                    </div>
                    
                    <!-- ID Number -->
                    <div>
                        <label for="id_number" class="block text-sm font-medium text-gray-700 mb-2">
                            ID Number
                        </label>
                        <input type="text" id="id_number" name="id_number"
                               class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                               placeholder="National ID or Passport">
                        <div class="mt-1 text-sm text-red-600 hidden" id="id_number_error"></div>
                    </div>
                </div>
            </div>
            
            <!-- Visit Information Section -->
            <div class="border-t border-gray-200 pt-6">
                <h3 class="text-lg font-medium text-gray-900 mb-4">Visit Information</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Company -->
                    <div>
                        <label for="company" class="block text-sm font-medium text-gray-700 mb-2">
                            Company/Organization
                        </label>
                        <input type="text" id="company" name="company"
                               class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                               placeholder="Company name (optional)">
                        <div class="mt-1 text-sm text-red-600 hidden" id="company_error"></div>
                    </div>
                    
                    <!-- Location -->
                    <div>
                        <label for="location_id" class="block text-sm font-medium text-gray-700 mb-2">
                            Location <span class="text-red-500">*</span>
                        </label>
                        <select id="location_id" name="location_id" required
                                class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                            <option value="">Select location</option>
                            {% for location in locations %}
                            <option value="{{ location.id }}" 
                                    {% if user.location_id == location.id %}selected{% endif %}>
                                {{ location.name }}
                            </option>
                            {% endfor %}
                        </select>
                        <div class="mt-1 text-sm text-red-600 hidden" id="location_id_error"></div>
                    </div>
                    
                    <!-- Host Name -->
                    <div>
                        <label for="host_name" class="block text-sm font-medium text-gray-700 mb-2">
                            Host Contact
                        </label>
                        <input type="text" id="host_name" name="host_name"
                               class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                               placeholder="Person to meet">
                        <div class="mt-1 text-sm text-red-600 hidden" id="host_name_error"></div>
                    </div>
                    
                    <!-- Host Phone -->
                    <div>
                        <label for="host_phone" class="block text-sm font-medium text-gray-700 mb-2">
                            Host Phone
                        </label>
                        <input type="tel" id="host_phone" name="host_phone"
                               class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                               placeholder="+254 700 000 000">
                        <div class="mt-1 text-sm text-red-600 hidden" id="host_phone_error"></div>
                    </div>
                    
                    <!-- Expected Duration -->
                    <div>
                        <label for="expected_duration" class="block text-sm font-medium text-gray-700 mb-2">
                            Expected Duration (hours)
                        </label>
                        <select id="expected_duration" name="expected_duration"
                                class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                            <option value="">Select duration</option>
                            <option value="1">1 hour</option>
                            <option value="2">2 hours</option>
                            <option value="4">4 hours</option>
                            <option value="8">8 hours (Full day)</option>
                            <option value="24">24 hours</option>
                            <option value="48">2 days</option>
                            <option value="72">3 days</option>
                            <option value="168">1 week</option>
                        </select>
                        <div class="mt-1 text-sm text-red-600 hidden" id="expected_duration_error"></div>
                    </div>
                </div>
                
                <!-- Purpose -->
                <div class="mt-6">
                    <label for="purpose" class="block text-sm font-medium text-gray-700 mb-2">
                        Purpose of Visit
                    </label>
                    <textarea id="purpose" name="purpose" rows="3"
                              class="block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                              placeholder="Describe the purpose of this visit..."></textarea>
                    <div class="mt-1 text-sm text-red-600 hidden" id="purpose_error"></div>
                </div>
            </div>
            
            <!-- Quick Actions -->
            <div class="border-t border-gray-200 pt-6">
                <div class="flex items-center space-x-4">
                    <label class="flex items-center">
                        <input type="checkbox" id="auto_check_in" 
                               class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
                        <span class="ml-2 text-sm text-gray-700">Automatically check in after registration</span>
                    </label>
                    
                    <label class="flex items-center">
                        <input type="checkbox" id="generate_qr" checked
                               class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
                        <span class="ml-2 text-sm text-gray-700">Generate QR code sticker</span>
                    </label>
                </div>
            </div>
            
            <!-- Submit Buttons -->
            <div class="border-t border-gray-200 pt-6">
                <div class="flex justify-end space-x-3">
                    <a href="/visitors" 
                       class="px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                        Cancel
                    </a>
                    
                    <button type="submit" id="submit-btn"
                            class="px-6 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed">
                        <span id="submit-text">Register Visitor</span>
                        <div id="submit-spinner" class="hidden inline-flex items-center">
                            <div class="loading-spinner w-4 h-4 border-2 border-white border-t-transparent rounded-full mr-2"></div>
                            Processing...
                        </div>
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

<!-- Success Modal -->
<div id="success-modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden z-50">
    <div class="relative top-20 mx-auto p-5 border w-11/12 md:w-1/2 lg:w-1/3 shadow-lg rounded-md bg-white">
        <div class="mt-3 text-center">
            <!-- Success Icon -->
            <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-green-100 mb-4">
                <i data-feather="check" class="h-6 w-6 text-green-600"></i>
            </div>
            
            <h3 class="text-lg font-medium text-gray-900 mb-2">Visitor Registered Successfully!</h3>
            <div id="success-message" class="text-sm text-gray-600 mb-6"></div>
            
            <!-- QR Code Display -->
            <div id="qr-display" class="hidden mb-6">
                <h4 class="text-sm font-medium text-gray-900 mb-3">QR Code Sticker</h4>
                <div id="qr-image" class="bg-gray-50 rounded-lg p-4"></div>
            </div>
            
            <!-- Action Buttons -->
            <div class="flex flex-col sm:flex-row gap-3 justify-center">
                <button onclick="downloadQRSticker()" id="download-qr-btn" 
                        class="hidden inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700">
                    <i data-feather="download" class="w-4 h-4 mr-2"></i>
                    Download QR Sticker
                </button>
                
                <button onclick="addAnotherVisitor()" 
                        class="inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50">
                    <i data-feather="user-plus" class="w-4 h-4 mr-2"></i>
                    Add Another
                </button>
                
                <button onclick="viewVisitors()" 
                        class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-green-600 hover:bg-green-700">
                    <i data-feather="list" class="w-4 h-4 mr-2"></i>
                    View All Visitors
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
// Global variables
let registeredVisitor = null;
let qrStickerData = null;

// Initialize form
document.addEventListener('DOMContentLoaded', function() {
    setupFormValidation();
    setupPhoneFormatting();
    
    // Auto-focus first field
    document.getElementById('full_name').focus();
});

// Setup form validation
function setupFormValidation() {
    const form = document.getElementById('visitor-form');
    
    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        if (validateForm()) {
            await submitForm();
        }
    });
    
    // Real-time validation
    const fields = ['full_name', 'phone', 'email', 'location_id'];
    fields.forEach(fieldId => {
        const field = document.getElementById(fieldId);
        field.addEventListener('blur', () => validateField(fieldId));
        field.addEventListener('input', () => clearFieldError(fieldId));
    });
}

// Setup phone formatting
function setupPhoneFormatting() {
    const phoneFields = ['phone', 'host_phone'];
    
    phoneFields.forEach(fieldId => {
        const field = document.getElementById(fieldId);
        
        field.addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            
            // Format Kenyan phone numbers
            if (value.startsWith('254')) {
                value = '+254 ' + value.slice(3, 6) + ' ' + value.slice(6, 9) + ' ' + value.slice(9, 12);
            } else if (value.startsWith('0') && value.length > 1) {
                value = '+254 ' + value.slice(1, 4) + ' ' + value.slice(4, 7) + ' ' + value.slice(7, 10);
            } else if (value.length > 0 && !value.startsWith('+')) {
                value = '+254 ' + value.slice(0, 3) + ' ' + value.slice(3, 6) + ' ' + value.slice(6, 9);
            }
            
            e.target.value = value.trim();
        });
    });
}

// Validate form
function validateForm() {
    let isValid = true;
    
    // Required fields
    const requiredFields = ['full_name', 'location_id'];
    
    requiredFields.forEach(fieldId => {
        if (!validateField(fieldId)) {
            isValid = false;
        }
    });
    
    // Email validation (if provided)
    const email = document.getElementById('email').value;
    if (email && !isValidEmail(email)) {
        showFieldError('email', 'Please enter a valid email address');
        isValid = false;
    }
    
    // Phone validation (if provided)
    const phone = document.getElementById('phone').value;
    if (phone && !isValidPhone(phone)) {
        showFieldError('phone', 'Please enter a valid phone number');
        isValid = false;
    }
    
    return isValid;
}

// Validate individual field
function validateField(fieldId) {
    const field = document.getElementById(fieldId);
    const value = field.value.trim();
    
    // Required field validation
    if (field.required && !value) {
        showFieldError(fieldId, 'This field is required');
        return false;
    }
    
    // Specific field validations
    switch (fieldId) {
        case 'full_name':
            if (value.length < 2) {
                showFieldError(fieldId, 'Name must be at least 2 characters long');
                return false;
            }
            break;
            
        case 'email':
            if (value && !isValidEmail(value)) {
                showFieldError(fieldId, 'Please enter a valid email address');
                return false;
            }
            break;
            
        case 'phone':
            if (value && !isValidPhone(value)) {
                showFieldError(fieldId, 'Please enter a valid phone number');
                return false;
            }
            break;
    }
    
    clearFieldError(fieldId);
    return true;
}

// Show field error
function showFieldError(fieldId, message) {
    const field = document.getElementById(fieldId);
    const errorDiv = document.getElementById(`${fieldId}_error`);
    
    field.classList.add('border-red-300', 'focus:border-red-500', 'focus:ring-red-500');
    field.classList.remove('border-gray-300', 'focus:border-blue-500', 'focus:ring-blue-500');
    
    errorDiv.textContent = message;
    errorDiv.classList.remove('hidden');
}

// Clear field error
function clearFieldError(fieldId) {
    const field = document.getElementById(fieldId);
    const errorDiv = document.getElementById(`${fieldId}_error`);
    
    field.classList.remove('border-red-300', 'focus:border-red-500', 'focus:ring-red-500');
    field.classList.add('border-gray-300', 'focus:border-blue-500', 'focus:ring-blue-500');
    
    errorDiv.classList.add('hidden');
}

// Email validation
function isValidEmail(email) {
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    return emailRegex.test(email);
}

// Phone validation
function isValidPhone(phone) {
    // Simple validation for international format
    const phoneRegex = /^\+\d{1,3}\s?\d{3}\s?\d{3}\s?\d{3}$/;
    return phoneRegex.test(phone.replace(/\s/g, ''));
}

// Submit form
async function submitForm() {
    const submitBtn = document.getElementById('submit-btn');
    const submitText = document.getElementById('submit-text');
    const submitSpinner = document.getElementById('submit-spinner');
    
    // Show loading state
    submitBtn.disabled = true;
    submitText.classList.add('hidden');
    submitSpinner.classList.remove('hidden');
    
    try {
        // Prepare form data
        const formData = {
            full_name: document.getElementById('full_name').value.trim(),
            phone: document.getElementById('phone').value.trim() || null,
            email: document.getElementById('email').value.trim() || null,
            id_number: document.getElementById('id_number').value.trim() || null,
            company: document.getElementById('company').value.trim() || null,
            purpose: document.getElementById('purpose').value.trim() || null,
            host_name: document.getElementById('host_name').value.trim() || null,
            host_phone: document.getElementById('host_phone').value.trim() || null,
            expected_duration: parseInt(document.getElementById('expected_duration').value) || null,
            location_id: parseInt(document.getElementById('location_id').value)
        };
        
        // Submit to API
        const response = await fetch('/visitors/api/create', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(formData)
        });
        
        const data = await response.json();
        
        if (response.ok && data.success) {
            registeredVisitor = data.visitor;
            
            // Auto check-in if requested
            if (document.getElementById('auto_check_in').checked) {
                await autoCheckIn(data.visitor.id);
            }
            
            // Generate QR sticker if requested
            if (document.getElementById('generate_qr').checked) {
                await generateQRSticker(data.visitor.id);
            }
            
            showSuccessModal(data);
            
        } else {
            // Handle validation errors
            if (data.error && typeof data.error === 'object') {
                Object.keys(data.error).forEach(fieldId => {
                    showFieldError(fieldId, data.error[fieldId]);
                });
            } else {
                showNotification('error', 'Registration Failed', data.message || 'Failed to register visitor');
            }
        }
        
    } catch (error) {
        console.error('Error registering visitor:', error);
        showNotification('error', 'Error', 'Failed to register visitor. Please try again.');
        
    } finally {
        // Reset button state
        submitBtn.disabled = false;
        submitText.classList.remove('hidden');
        submitSpinner.classList.add('hidden');
    }
}

// Auto check-in visitor
async function autoCheckIn(visitorId) {
    try {
        const response = await fetch('/visitors/api/check-in', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                visitor_id: visitorId,
                notes: 'Auto check-in after registration'
            })
        });
        
        if (response.ok) {
            showNotification('success', 'Auto Check-in', 'Visitor has been automatically checked in');
        }
    } catch (error) {
        console.error('Auto check-in error:', error);
    }
}

// Generate QR sticker
async function generateQRSticker(visitorId) {
    try {
        const response = await fetch(`/visitors/api/${visitorId}/qr-sticker?size=medium`);
        const data = await response.json();
        
        if (response.ok && data.success) {
            qrStickerData = data;
        }
    } catch (error) {
        console.error('QR generation error:', error);
    }
}

// Show success modal
function showSuccessModal(data) {
    const modal = document.getElementById('success-modal');
    const messageDiv = document.getElementById('success-message');
    const qrDisplay = document.getElementById('qr-display');
    const qrImage = document.getElementById('qr-image');
    const downloadBtn = document.getElementById('download-qr-btn');
    
    // Set success message
    let message = `${data.visitor.full_name} has been registered successfully.`;
    if (document.getElementById('auto_check_in').checked) {
        message += ' The visitor has been automatically checked in.';
    }
    messageDiv.textContent = message;
    
    // Show QR code if generated
    if (qrStickerData) {
        qrImage.innerHTML = `<img src="${qrStickerData.sticker}" alt="QR Code Sticker" class="mx-auto max-w-full h-auto rounded">`;
        qrDisplay.classList.remove('hidden');
        downloadBtn.classList.remove('hidden');
    }
    
    modal.classList.remove('hidden');
    feather.replace();
}

// Download QR sticker
function downloadQRSticker() {
    if (!qrStickerData) return;
    
    const link = document.createElement('a');
    link.href = qrStickerData.sticker;
    link.download = qrStickerData.filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}

// Add another visitor
function addAnotherVisitor() {
    // Reset form
    document.getElementById('visitor-form').reset();
    
    // Reset any error states
    const errorDivs = document.querySelectorAll('[id$="_error"]');
    errorDivs.forEach(div => div.classList.add('hidden'));
    
    const fields = document.querySelectorAll('input, select, textarea');
    fields.forEach(field => {
        field.classList.remove('border-red-300', 'focus:border-red-500', 'focus:ring-red-500');
        field.classList.add('border-gray-300', 'focus:border-blue-500', 'focus:ring-blue-500');
    });
    
    // Reset state
    registeredVisitor = null;
    qrStickerData = null;
    
    // Close modal
    document.getElementById('success-modal').classList.add('hidden');
    
    // Focus first field
    document.getElementById('full_name').focus();
    
    showNotification('info', 'Ready', 'Form cleared. Ready to register another visitor.');
}

// View all visitors
function viewVisitors() {
    window.location.href = '/visitors';
}

// Keyboard shortcuts
document.addEventListener('keydown', function(e) {
    // Ctrl/Cmd + Enter to submit
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        document.getElementById('visitor-form').dispatchEvent(new Event('submit'));
    }
    
    // Escape to go back
    if (e.key === 'Escape') {
        const modal = document.getElementById('success-modal');
        if (!modal.classList.contains('hidden')) {
            modal.classList.add('hidden');
        } else {
            window.location.href = '/visitors';
        }
    }
});
</script>
{% endblock %}
